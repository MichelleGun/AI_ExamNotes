<script>
  (function(){
    var groups = [["g-l1","Search",[2,3]],["g-l2","Learning",[4,5]],["g-l3","Decisions",[6]],["g-l4","Deep learning",[7,8,9]],["g-l5","Reasoning",[10,11,12]]];
    var T = window.TOPICS;
    document.getElementById("topiclinks").innerHTML = groups.map(function(g){
      var ts = T.filter(function(t){return g[2].indexOf(t.num) >= 0}).sort(function(a,b){return a.num-b.num});
      return '<div class="navg sub '+g[0]+'"><div class="navh">'+g[1]+'</div>'+ts.map(function(t){return '<a href="#/topic/'+t.id+'">L'+t.num+' '+t.title+'</a>'}).join("")+'</div>';
    }).join("");
  })();
</script>
